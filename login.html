<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#071a2b"><title>تسجيل الدخول | سوبر ماركت بن سليمان</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/modules.css"></head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#020617,#0f172a,#172554)">
<section class="module-card" style="width:min(100%,430px);padding:28px">
<div style="text-align:center;margin-bottom:22px"><div class="loader-logo" style="margin:0 auto 12px;width:70px;height:70px">🛒</div><h1 style="font-size:20px;margin:0;color:#0f172a">سوبر ماركت بن سليمان</h1><p style="font-size:10px;color:#64748b;margin-top:5px">تسجيل الدخول إلى النظام</p></div>
<form id="login-form" class="module-form" style="grid-template-columns:1fr">
<div class="field"><label>اسم المستخدم</label><input name="username" autocomplete="username" required></div>
<div class="field"><label>كلمة المرور</label><input name="password" type="password" autocomplete="current-password" required></div>
<button class="btn btn-primary" style="width:100%;padding:12px">دخول النظام</button>
</form>
<div class="notice" style="margin-top:15px">للتجربة: <strong>admin</strong> / <strong>123456</strong></div>
<a href="index.html" class="btn btn-light" style="display:block;text-align:center;margin-top:10px">العودة</a>
</section></main>
<script src="js/data.js"></script><script src="js/system.js"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('login-form');f.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(f),r=BS.login(d.get('username'),d.get('password'));if(r.success)location.href='dashboard.html';else{alert(r.message);f.password.value='';f.password.focus()}})});</script>
</body></html>
